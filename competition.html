<!doctype html>
<html lang="en" data-bs-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap"
      rel="stylesheet"
    />
    <link href="css/style.css" rel="stylesheet" />
    <link href="css/header.css" rel="stylesheet" />
    <link href="css/competition.css" rel="stylesheet" />
    <link href="css/footer.css" rel="stylesheet" />
    <title>Competitions</title>
  </head>
  <body>
    <!-- Navbar -->
    <header id="header"></header>

    <!-- Competition Section -->
    <section class="competition-page py-5">
      <div class="container">
        <!-- Top -->
        <div class="row align-items-center mb-4">
          <div class="col-lg-7">
            <h1 class="competition-title">
              All <span>Competitions</span> & Hackathons
            </h1>

            <p class="filter-text">Filter by category</p>
          </div>

          <div class="col-lg-5">
            <div class="search-box">
              <i class="bi bi-search"></i>

              <input
                type="text"
                id="searchInput"
                class="form-control"
                placeholder="Search competitions..."
              />
            </div>
          </div>
        </div>

        <!-- Filter Card -->
        <div class="filter-card">
          <!-- Level -->

          <div class="filter-row">
            <div class="filter-title">LEVEL</div>

            <div class="filter-options">
              <label>
                <input type="checkbox" value="All" class="level-filter" />
                All
              </label>

              <label>
                <input
                  type="checkbox"
                  value="High School"
                  class="level-filter"
                />
                High School
              </label>

              <label>
                <input
                  type="checkbox"
                  value="University"
                  class="level-filter"
                />
                University
              </label>

              <label>
                <input type="checkbox" value="Any Level" class="level-filter" />
                Any Level
              </label>
            </div>
          </div>

          <!-- Category -->

          <div class="filter-row">
            <div class="filter-title">CATEGORY</div>

            <div class="filter-options">
              <label
                ><input type="checkbox" value="All" class="category-filter" />
                All</label
              >

              <label
                ><input type="checkbox" value="Tech" class="category-filter" />
                Tech</label
              >

              <label
                ><input
                  type="checkbox"
                  value="Business"
                  class="category-filter"
                />
                Business</label
              >

              <label
                ><input
                  type="checkbox"
                  value="Design"
                  class="category-filter"
                />
                Design</label
              >

              <label
                ><input
                  type="checkbox"
                  value="Science"
                  class="category-filter"
                />
                Science</label
              >

              <label
                ><input type="checkbox" value="Other" class="category-filter" />
                Other</label
              >
            </div>
          </div>

          <!-- Sort -->

          <div class="filter-row justify-content-between align-items-center">
            <div class="filter-title">SORT BY</div>

            <select id="sortSelect" class="form-select">
              <option>Deadline - Earliest</option>

              <option>Deadline - Latest</option>

              <option>Name A-Z</option>

              <option>Name Z-A</option>
            </select>
          </div>
        </div>
      </div>
    </section>

    <!-- Card Section -->
  <section class="py-5">
    <div class="container">
        <div class="row g-4" id="competitionContainer"></div>
    </div>
  </section>

    <script src="js/header.js"></script>
    <script src="js/events-data.js"></script>
    <script src="js/event-render.js"></script>
    <script src="js/competition.js"></script>
    <script src="js/footer.js"></script>
  </body>
</html>
